name: "Keep an eye on TruffleRuby HEAD"
on:
  workflow_dispatch:
  schedule:
    - cron: "10 10 * * *"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
        ruby-version:
          - "truffleruby-head"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
      - uses: "ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b" # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: "bundle exec minitest"
